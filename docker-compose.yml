services:
  postgres:
    image: postgres:16-alpine
    container_name: karaoke-postgres
    environment:
      POSTGRES_DB: karaoke
      POSTGRES_USER: karaoke
      POSTGRES_PASSWORD: karaoke
    ports:
      # 5433 on the host to avoid clashing with a locally installed PostgreSQL on 5432.
      # Bind loopback only: this dev database must not be reachable from the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - karaoke-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karaoke -d karaoke"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  karaoke-pgdata:
