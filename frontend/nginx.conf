map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Resolve the real client IP once and overwrite (never append to) X-Forwarded-For,
# so a client cannot spoof its own address. Cloudflare Tunnel sets CF-Connecting-IP;
# direct Caddy setups should send the same header (see deploy/README.md).
# CF-Connecting-IP is only honoured when the direct peer is the local TLS proxy
# (loopback or the Docker bridge). A client reaching this container directly from
# the internet/LAN therefore cannot spoof its address through that header.
geo $remote_addr $from_local_proxy {
    default 0;
    127.0.0.0/8 1;
    ::1/128 1;
    172.16.0.0/12 1;
}

map "$from_local_proxy:$http_cf_connecting_ip" $karaoke_client_ip {
    "~^1:[0-9a-fA-F:.]{3,45}$" $http_cf_connecting_ip;
    default $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep non-upload requests small; only the dedicated upload endpoint accepts 420 MB.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    # 'unsafe-inline' is required by the bootstrap script in index.html and by
    # SockJS fallback frames; there is no HTML/eval sink in the app itself.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; media-src 'self' blob: https://res.cloudinary.com; connect-src 'self' wss:" always;

    location = /api/admin/upload-song {
        client_max_body_size 420m;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $karaoke_client_ip;
        proxy_set_header X-Forwarded-For $karaoke_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $karaoke_client_ip;
        proxy_set_header X-Forwarded-For $karaoke_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /ws-karaoke/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $karaoke_client_ip;
        proxy_set_header X-Forwarded-For $karaoke_client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # nginx only inherits server-level add_header when a location defines none,
        # so repeat the security headers here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; media-src 'self' blob: https://res.cloudinary.com; connect-src 'self' wss:" always;
        add_header Cache-Control "public, immutable";
    }

    location /actuator/ {
        # Health is for the container/host only, never the public internet.
        return 404;
    }

    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; media-src 'self' blob: https://res.cloudinary.com; connect-src 'self' wss:" always;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
