spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/karaoke}
spring.datasource.username=${DB_USERNAME:karaoke}
spring.datasource.password=${DB_PASSWORD:karaoke}

# Dev-only local admin (created only while the admins table is empty).
# Leave the password empty to get a one-time random password in the startup log.
app.admin.bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:admin}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.cookie-secure=${ADMIN_COOKIE_SECURE:false}
