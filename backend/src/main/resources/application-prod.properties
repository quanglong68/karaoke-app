spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.flyway.clean-disabled=true
app.admin.cookie-secure=true
app.allowed-origins=${APP_ALLOWED_ORIGINS:}
# Only true when a trusted proxy overwrites X-Forwarded-For; otherwise clients can
# spoof their IP to dodge rate limits. docker-compose.prod.yml requires an explicit value.
app.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
