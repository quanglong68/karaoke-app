spring.application.name=karaoke-backend
server.port=8080

# Local runs use the dev profile (PostgreSQL from docker-compose.yml).
# Production must set SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:200MB}
# A song upload sends the video and the vocal track in one multipart request.
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:420MB}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

app.admin.session-days=${ADMIN_SESSION_DAYS:7}
app.admin.cookie-secure=${ADMIN_COOKIE_SECURE:true}
app.admin.bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}

app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,https://localhost:5173,https://localhost:3000,https://127.0.0.1:5173,https://127.0.0.1:3000,http://192.168.*:[*],http://10.*:[*],http://172.*:[*],https://192.168.*:[*],https://10.*:[*],https://172.*:[*]}
# Only enable when a trusted reverse proxy overwrites X-Forwarded-For; otherwise clients can spoof it.
app.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
app.legacy-import.enabled=${APP_LEGACY_IMPORT_ENABLED:false}
app.legacy-import.path=${APP_LEGACY_IMPORT_PATH:data/songs.json}
app.python-command=${PYTHON_COMMAND:python}
app.extract-timeout-seconds=${EXTRACT_TIMEOUT_SECONDS:300}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
