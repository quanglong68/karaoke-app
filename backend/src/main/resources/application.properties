spring.application.name=karaoke-backend
server.port=8080

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:200MB}

spring.h2.console.enabled=false

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

admin.api-key=${ADMIN_API_KEY:}

app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,https://localhost:5173,https://localhost:3000,https://127.0.0.1:5173,https://127.0.0.1:3000,http://192.168.*:[*],http://10.*:[*],http://172.*:[*],https://192.168.*:[*],https://10.*:[*],https://172.*:[*]}
app.max-rounds=${APP_MAX_ROUNDS:3}
app.python-command=${PYTHON_COMMAND:python}
app.extract-timeout-seconds=${EXTRACT_TIMEOUT_SECONDS:300}
